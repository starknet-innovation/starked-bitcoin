name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # arm64, as the local builds and the pages workflow.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Zig from ziglang.org, checked against its published SHA-256 (third-party setup actions are not
      # on the org's allow list). Keep the version equal to minimum_zig_version in build.zig.zon.
      - name: Install Zig 0.15.2
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-linux-0.15.2.tar.xz
          echo "958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          rm zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      # elan's release binary, checked against the SHA-256 GitHub publishes for it (elan-init.sh would
      # fetch the latest release instead). elan then installs the Lean version in lean/lean-toolchain.
      - name: Install elan 4.4.0
        run: |
          curl -sSfL -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.4.0/elan-aarch64-unknown-linux-gnu.tar.gz
          echo "45cde3006f82f98804c94cf2ca4949d117060a5f3cc8afa62f523759947ee21f  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          rm elan.tar.gz "$RUNNER_TEMP/elan-init"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Skips the Zig test suite and the AIR drift check (about an hour); see scripts/check.sh.
      - run: ./scripts/check.sh
