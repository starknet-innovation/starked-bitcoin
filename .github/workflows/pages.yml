# WEB-MEMBER: builds the site (webverify.wasm + page + the seal's proof files) and publishes it to
# GitHub Pages. The coin set itself is not here: config.json points at the set file and its segment
# index in object storage (repository variables SET_URL and INDEX_URL; see web/README.md).
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "vk/**", "build.zig", "build.zig.zon", "third_party/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Zig from ziglang.org, checked against its published SHA-256 (third-party setup actions are not
      # on the org's allow list).
      - name: Install Zig 0.15.2
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (and verify the seal with the built wasm)
        env:
          SET_URL: ${{ vars.SET_URL }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
