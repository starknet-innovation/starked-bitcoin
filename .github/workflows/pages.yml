# WEB-MEMBER: builds the site (webverify.wasm + page + the seal's proof files) and publishes it to
# GitHub Pages. The coin set itself is not here: config.json points at the set file and its segment
# index in object storage (repository variables SET_URL and INDEX_URL; see web/README.md).
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "vk/**", "build.zig", "build.zig.zon", "third_party/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # macOS (arm64), as the local builds: stwo-zig's circuit_cpu build gives its host code generator a
    # module built for the wasm target, which LLVM only warns about on arm64 but crashes on x86_64
    # ("64-bit code requested on a subtarget that doesn't support it"). Fix upstream, then move to Linux.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Zig from ziglang.org, checked against its published SHA-256 (third-party setup actions are not
      # on the org's allow list).
      - name: Install Zig 0.15.2
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (and verify the seal with the built wasm)
        env:
          SET_URL: ${{ vars.SET_URL }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
